# Co kilkanaście minut sprawdza, czy któraś aplikacja ma nowe wydanie,
# i podbija jej wpis w apps.json. Dzięki temu Porta widzi aktualizacje
# bez ręcznego edytowania katalogu. Można też uruchomić ręcznie.
name: Synchronizuj wersje

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź wydania aplikacji
        run: python3 tools/sync_versions.py
      - name: Zapisz zmiany
        run: |
          if git diff --quiet apps.json; then
            echo "Brak nowych wersji."
            exit 0
          fi
          git config user.name "porta-sync"
          git config user.email "porta-sync@users.noreply.github.com"
          git add apps.json
          git commit -m "Katalog: nowe wersje aplikacji"
          git pull --rebase -q
          git push
